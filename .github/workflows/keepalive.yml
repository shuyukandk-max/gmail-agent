name: Keepalive

on:
  schedule:
    - cron: '0 0 * * 1'  # 每週一 00:00 UTC，防止 GitHub 因不活躍停掉排程
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
