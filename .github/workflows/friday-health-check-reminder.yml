name: Friday AI Brain Health Check Reminder

on:
  schedule:
    - cron: '0 1 * * 5'  # 每週五 09:00 Asia/Taipei (UTC+8)
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Send LINE reminder
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_CHANNEL_ACCESS_TOKEN}" \
            -d "{
              \"to\": \"${LINE_USER_ID}\",
              \"messages\": [
                {
                  \"type\": \"text\",
                  \"text\": \"🩺 週五早安！AI 分身體檢提醒\n\n開始今天工作前跑一下體檢腳本，確認 AI 大腦運作正常：\n\nbash ~/Library/CloudStorage/GoogleDrive-admin@lumiora.studio/我的雲端硬碟/demi-agent/000_Agent/scripts/sync-health.sh\n\n🎉 看到「全部正常」就可以放心複盤了！\"
                }
              ]
            }"
