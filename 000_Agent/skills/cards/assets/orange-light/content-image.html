<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Content Image — 晶白系</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .card {
    width: 1080px;
    height: 1350px;
    background: #FDFAF6;
    position: relative;
    overflow: hidden;
    font-family: 'Noto Serif TC', serif;
  }
  /* 頂部金色細邊 */
  .deco-bar {
    position: absolute;
    top: 0;
    left: 90px;
    right: 90px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #A29464, transparent);
  }
  /* 極細格紋 */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(162,148,100,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(162,148,100,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .title {
    position: absolute;
    top: 100px;
    left: 90px;
    right: 90px;
    font-family: 'Noto Serif TC', serif;
    font-size: 68px;
    font-weight: 700;
    color: #A29464;
    line-height: 1.4;
    z-index: 1;
  }
  .description {
    position: absolute;
    top: 290px;
    left: 90px;
    right: 90px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 38px;
    font-weight: 400;
    color: rgba(44,38,32,0.65);
    line-height: 1.7;
    z-index: 1;
  }
  .image-area {
    position: absolute;
    top: 560px;
    left: 90px;
    right: 90px;
    bottom: 140px;
    background: #CFC5B2;
    border-radius: 4px;
    overflow: hidden;
    z-index: 1;
  }
  .image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .handle {
    position: absolute;
    bottom: 60px;
    left: 90px;
    font-family: 'Montserrat', sans-serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: rgba(44,38,32,0.22);
    z-index: 1;
  }
</style>
</head>
<body>
<div class="card">
  <div class="deco-bar"></div>
  <h2 class="title">標題標題標題標題標題</h2>
  <p class="description">內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文</p>
  <div class="image-area">
    <!-- 替換為 <img src="your-image.jpg"> -->
  </div>
  <span class="handle">璀晶之燦</span>
</div>
</body>
</html>
