<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Cover — 晶白系</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .card {
    width: 1080px;
    height: 1350px;
    background: #FDFAF6;
    position: relative;
    overflow: hidden;
    font-family: 'Noto Serif TC', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* 頂部金色薄紗 */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 500px;
    background: linear-gradient(180deg, rgba(162,148,100,0.1) 0%, transparent 100%);
    pointer-events: none;
  }
  /* 極細金色格紋 */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(162,148,100,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(162,148,100,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .brand-tag {
    position: absolute;
    top: 52px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: rgba(162,148,100,0.55);
    text-transform: uppercase;
    z-index: 1;
  }
  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
    padding: 0 100px;
  }
  .label {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: #90BCCF;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .title {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 84px;
    color: #A29464;
    text-align: center;
    line-height: 1.35;
    margin-bottom: 28px;
  }
  .divider {
    width: 48px;
    height: 1px;
    background: #CFC5B2;
    margin-bottom: 32px;
  }
  .subtitle {
    font-family: 'Noto Sans TC', 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 40px;
    color: #2C2620;
    text-align: center;
    line-height: 1.7;
    opacity: 0.7;
  }
  .handle {
    position: absolute;
    bottom: 60px;
    left: 90px;
    font-family: 'Montserrat', sans-serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: rgba(44,38,32,0.22);
  }
</style>
</head>
<body>
<div class="card">
  <span class="brand-tag">璀晶之燦</span>
  <div class="content">
    <p class="label">Crystal · Energy</p>
    <h1 class="title">標題標題<br>標題標題標題標題</h1>
    <div class="divider"></div>
    <p class="subtitle">副標題副標題副標題</p>
  </div>
  <span class="handle">璀晶之燦</span>
</div>
</body>
</html>
