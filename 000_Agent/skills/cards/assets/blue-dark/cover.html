<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Cover — 深地系</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .card {
    width: 1080px;
    height: 1350px;
    background:
      radial-gradient(ellipse 800px 700px at 95% 5%, rgba(144,188,207,0.18) 0%, transparent 65%),
      radial-gradient(ellipse 900px 800px at 5% 95%, rgba(162,148,100,0.22) 0%, transparent 65%),
      #1A1507;
    position: relative;
    overflow: hidden;
    font-family: 'Noto Serif TC', 'Cormorant Garamond', serif;
  }
  /* 細線裝飾 */
  .deco-line {
    position: absolute;
    top: 80px;
    left: 90px;
    right: 90px;
    height: 1px;
    background: rgba(162,148,100,0.35);
  }
  .deco-line-bottom {
    position: absolute;
    bottom: 140px;
    left: 90px;
    right: 90px;
    height: 1px;
    background: rgba(162,148,100,0.35);
  }
  /* 品牌標籤 */
  .brand-tag {
    position: absolute;
    top: 44px;
    left: 90px;
    font-family: 'Montserrat', sans-serif;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: rgba(162,148,100,0.6);
    text-transform: uppercase;
  }
  .content {
    position: absolute;
    bottom: 220px;
    left: 90px;
    right: 90px;
  }
  .label {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: #A29464;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .title {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 84px;
    color: #FDFAF6;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  .subtitle {
    font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
    font-weight: 300;
    font-size: 38px;
    color: rgba(144,188,207,0.75);
    line-height: 1.6;
    letter-spacing: 0.02em;
  }
  .handle {
    position: absolute;
    bottom: 60px;
    left: 90px;
    font-family: 'Montserrat', sans-serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: rgba(253,250,246,0.25);
  }
</style>
</head>
<body>
<div class="card">
  <div class="deco-line"></div>
  <div class="deco-line-bottom"></div>
  <span class="brand-tag">璀晶之燦</span>
  <div class="content">
    <p class="label">Crystal · Energy</p>
    <h1 class="title">標題標題<br>標題標題標題標題</h1>
    <p class="subtitle">副標題副標題副標題</p>
  </div>
  <span class="handle">璀晶之燦</span>
</div>
</body>
</html>
