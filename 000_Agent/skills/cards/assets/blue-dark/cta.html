<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>CTA — 深地系</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .card {
    width: 1080px;
    height: 1350px;
    background:
      radial-gradient(ellipse 800px 700px at 95% 5%, rgba(144,188,207,0.18) 0%, transparent 65%),
      radial-gradient(ellipse 900px 800px at 5% 95%, rgba(162,148,100,0.22) 0%, transparent 65%),
      #1A1507;
    position: relative;
    overflow: hidden;
    font-family: 'Noto Serif TC', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .deco-top {
    position: absolute;
    top: 80px;
    left: 90px;
    right: 90px;
    height: 1px;
    background: rgba(162,148,100,0.35);
  }
  .deco-bottom {
    position: absolute;
    bottom: 140px;
    left: 90px;
    right: 90px;
    height: 1px;
    background: rgba(162,148,100,0.35);
  }
  .brand-tag {
    position: absolute;
    top: 44px;
    left: 90px;
    font-family: 'Montserrat', sans-serif;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: rgba(162,148,100,0.6);
  }
  .label {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: #A29464;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .title {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 84px;
    color: #FDFAF6;
    text-align: center;
    line-height: 1.35;
    margin-bottom: 40px;
  }
  .subtitle {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 400;
    font-size: 36px;
    color: rgba(253,250,246,0.45);
    text-align: center;
    line-height: 1.7;
    margin-bottom: 56px;
    padding: 0 60px;
  }
  .handle-badge {
    display: inline-block;
    border: 1px solid rgba(162,148,100,0.5);
    color: #A29464;
    font-family: 'Montserrat', sans-serif;
    font-size: 36px;
    font-weight: 400;
    letter-spacing: 0.1em;
    padding: 20px 52px;
    border-radius: 2px;
  }
  .handle {
    position: absolute;
    bottom: 60px;
    left: 90px;
    font-family: 'Montserrat', sans-serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: rgba(253,250,246,0.25);
  }
</style>
</head>
<body>
<div class="card">
  <div class="deco-top"></div>
  <div class="deco-bottom"></div>
  <span class="brand-tag">璀晶之燦</span>
  <p class="label">Crystal · Energy</p>
  <h2 class="title">有幫助的話<br>記得按讚分享</h2>
  <p class="subtitle">更多水晶能量與靈性分享<br>追蹤我，不錯過最新內容</p>
  <span class="handle-badge">璀晶之燦</span>
  <span class="handle">璀晶之燦</span>
</div>
</body>
</html>
