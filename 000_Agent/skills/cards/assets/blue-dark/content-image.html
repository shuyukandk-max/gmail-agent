<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Content Image — 深地系</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .card {
    width: 1080px;
    height: 1350px;
    background:
      radial-gradient(ellipse 800px 700px at 95% 5%, rgba(144,188,207,0.18) 0%, transparent 65%),
      radial-gradient(ellipse 900px 800px at 5% 95%, rgba(162,148,100,0.22) 0%, transparent 65%),
      #1A1507;
    position: relative;
    overflow: hidden;
    font-family: 'Noto Serif TC', serif;
    padding: 88px 90px;
    display: flex;
    flex-direction: column;
  }
  .deco-line {
    position: absolute;
    top: 68px;
    left: 90px;
    width: 60px;
    height: 1px;
    background: #A29464;
  }
  .title {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 68px;
    color: #FDFAF6;
    line-height: 1.3;
    margin-bottom: 24px;
  }
  .description {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 400;
    font-size: 38px;
    color: rgba(144,188,207,0.75);
    line-height: 1.65;
    margin-bottom: 44px;
  }
  .image-area {
    flex: 1;
    background: rgba(162,148,100,0.15);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(162,148,100,0.2);
  }
  .image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .handle {
    position: absolute;
    bottom: 60px;
    left: 90px;
    font-family: 'Montserrat', sans-serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: rgba(253,250,246,0.25);
  }
</style>
</head>
<body>
<div class="card">
  <div class="deco-line"></div>
  <h2 class="title">標題標題標題標題標題</h2>
  <p class="description">內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文內文</p>
  <div class="image-area">
    <!-- 替換為 <img src="your-image.jpg"> -->
  </div>
  <span class="handle">璀晶之燦</span>
</div>
</body>
</html>
